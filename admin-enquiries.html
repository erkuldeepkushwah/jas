<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enquiries | JAS Admin</title>
  <style>
    *{box-sizing:border-box}
    [hidden]{display:none!important}
    body{margin:0;background:#f1f7fc;color:#163653;font:1rem/1.5 system-ui,sans-serif}
    header{background:#fff;border-bottom:3px solid #ffcc00;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
    header img{vertical-align:middle;object-fit:contain;margin-right:8px}
    a{color:#0061ac}
    main{max-width:1300px;margin:auto;padding:20px}
    h1{margin:0}
    form{display:flex;align-items:end;gap:10px;flex-wrap:wrap;margin:18px 0}
    label{display:grid;gap:4px;font-weight:600}
    .downloads{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}
    button,input{font:inherit;border:1px solid #a7bfd4;border-radius:8px;padding:8px 10px}
    button{background:#0061ac;color:#fff;cursor:pointer}
    button:disabled{opacity:.6;cursor:default}
    :focus-visible{outline:3px solid #dc9e00;outline-offset:2px}
    .scroll{overflow:auto;background:#fff;border:1px solid #d4e2ee;border-radius:12px;margin:14px 0}
    table{border-collapse:collapse;width:100%;text-align:left;min-width:760px}
    th,td{padding:10px;vertical-align:top;border-bottom:1px solid #d4e2ee;overflow-wrap:anywhere}
    dl{margin:6px 0} dt{font-weight:600} dd{margin:0 0 6px}
  </style>
  <script type="module" src="assets/admin-enquiries.js"></script>
</head>
<body>
  <header>
    <strong><img src="assets/img/logo.png" alt="" width="54" height="42">JAS Admin</strong>
    <nav aria-label="Admin navigation"><a href="admin.html">Website editor</a> · <a href="login.html">Account</a></nav>
  </header>
  <main>
    <h1>Enquiries</h1>
    <p id="status" role="status">Checking admin access…</p>
    <section id="admin-views" hidden>
      <form id="filters">
        <label>From date <input id="from-date" type="date"></label>
        <label>To date <input id="to-date" type="date"></label>
        <button type="submit">Apply filter</button>
      </form>
      <p>Dates use India Standard Time (IST).</p>
      <div class="downloads" role="group" aria-labelledby="downloads-label">
        <strong id="downloads-label">Download Excel</strong>
        <button type="button" data-export="all" disabled>All enquiries</button>
        <button type="button" data-export="bus" disabled>Bus</button>
        <button type="button" data-export="train" disabled>Train</button>
        <button type="button" data-export="flight" disabled>Flight</button>
        <button type="button" data-export="holiday" disabled>Holiday</button>
      </div>
      <div class="scroll">
        <table>
          <thead><tr><th>Received (IST)</th><th>Type</th><th>Name</th><th>Phone</th><th>Details</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <button type="button" id="more" hidden>Load more</button>
    </section>
  </main>
</body>
</html>
