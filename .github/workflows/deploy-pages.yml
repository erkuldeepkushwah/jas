name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html contact.html domestic.html international.html flight.html train.html bus.html about.html login.html admin.html _site/
          cp -r assets _site/
          node --input-type=module <<'JS'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { linkLogin } from './navigation.js';

          for (const file of readdirSync('_site')) {
            if (!file.endsWith('.html') || ['login.html', 'admin.html'].includes(file)) continue;
            const path = '_site/' + file;
            const html = linkLogin(readFileSync(path, 'utf8'), 'login.html');
            writeFileSync(path, html.replace(/<\/body>/i, '<script type="module" src="assets/content.js"></script></body>'));
          }
          JS
          # Jas/ holds raw theme copies; not part of the published site
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
